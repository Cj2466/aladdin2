[project]
name = "aladdin2-backend"
version = "0.1.0"
description = "Portfolio risk analytics backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "yfinance>=0.2.48",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "httpx>=0.27",
    "websockets>=13.0",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
    "fpdf2>=2.7",
    "psycopg[binary]>=3.2",
    "slowapi>=0.1.9",
    "statsmodels>=0.14",
    "bidask>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
